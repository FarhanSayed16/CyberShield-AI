# Local stack: API + optional MongoDB
# Usage (from backend/):
#   docker compose up --build
# Then: http://localhost:8000/api/health
#
# For Atlas instead of local Mongo, set MONGODB_URI in .env and comment out `mongo`.

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - cybersentinel_mongo_data:/data/db

  backend:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # Override URI for the compose network when using local mongo
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017}
      DB_NAME: ${DB_NAME:-cybersentinel}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    depends_on:
      - mongo
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

volumes:
  cybersentinel_mongo_data:
